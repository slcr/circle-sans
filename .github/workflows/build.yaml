name: Build font and specimen

on: push

# Only the newest push to a given ref is worth building: an older run's fonts are
# already stale, and both runs deploy to the same gh-pages branch, so whichever
# finishes last wins regardless of which commit is newer. Cancel the superseded
# run instead of racing it. Including github.ref in the group means a tag push
# gets its own group and cannot be cancelled by a later push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Deploy step pushes the QA report and proofs to the gh-pages branch.
# New repositories give GITHUB_TOKEN read-only access by default, which makes that
# push fail with a 403, so ask for write explicitly.
permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # full history, so the last tag is reachable for the version stamp

    # A push that touches only the specimen or the installer must not rebuild the
    # fonts: the key hashes what the font build reads, and nothing else. The
    # installer's Python lives in scripts/ too, hence the exclusions - without them
    # every installer change threw the fonts away and cost a five-minute rebuild.
    # On a hit, everything down to "setup site" is skipped, toolchain included.
    - name: Cache built fonts
      id: cache-fonts
      uses: actions/cache@v4
      with:
        path: |
          fonts
          out
        key: ${{ runner.os }}-fonts-${{ hashFiles('sources/**', 'Makefile', 'requirements*.txt', 'scripts/*.py', '!scripts/render-installer-art.py', '!scripts/installer-dmg.py') }}

    - name: Set up Python 3.10
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install sys tools/deps
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
    - uses: actions/cache@v6
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      with:
        path: ./venv/
        key: ${{ runner.os }}-py310-venv-v2-${{ hashFiles('requirements*.txt') }}
    - name: gen zip file name
      id: zip-name
      shell: bash
      # Set the archive name to repo name + "-assets" e.g "MavenPro-assets"
      run: echo "ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-fonts" >> $GITHUB_ENV

    # Give every build a version of its own. release.yaml stamps the tag verbatim
    # (v1.2 -> 1.200, v1.31 -> 1.310), so a release always leaves the last digit of
    # the three-digit fraction at zero. Dev builds spend that digit on the number of
    # commits since the last tag: three commits past v1.2 becomes 1.203, which sorts
    # after v1.2 and before any future v1.21. Without this the specimen ships
    # whatever the sources happen to say - the same number for every build, which is
    # the bug that had v1.0 and v1.1 both reporting 1.310.
    - name: Stamp a dev font version
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
        if [ -z "$TAG" ]; then
          echo "No v* tag reachable - leaving the sources' version alone."
          exit 0
        fi
        DIST=$(git rev-list --count "$TAG..HEAD")
        # Clamp so the counter cannot carry into the next release's fraction.
        # Builds 10+ commits past a tag all report the same version.
        if [ "$DIST" -gt 9 ]; then DIST=9; fi
        RAW="${TAG#v}"
        MAJ="${RAW%%.*}"
        REST="${RAW#*.}"
        FRAC=$(printf '%s000' "$REST" | cut -c1-3)
        # 10# forces base 10; a fraction like 000 would otherwise be read as octal.
        FONT_VERSION="${MAJ}.$(printf '%03d' $(( 10#$FRAC + DIST )))"
        echo "$TAG +$DIST commits -> font version $FONT_VERSION"
        make venv
        . venv/bin/activate
        for src in sources/*.glyphs; do
          bumpfontversion "$src" --new-version "$FONT_VERSION"
        done

    - name: Build font
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      run: make build
    - name: Check with fontbakery
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      run: make test
      continue-on-error: true
    - name: proof
      if: steps.cache-fonts.outputs.cache-hit != 'true'
      run: make proof
    - name: setup site
      run: |
        # The specimen is the landing page; it links on to the QA report and proofs.
        cp scripts/specimen.html out/index.html
        mkdir -p out/fonts
        # The specimen loads this one file for every weight and width.
        cp "fonts/webfonts/CircleSans[wdth,wght].woff2" out/fonts/CircleSans-Variable.woff2
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ github.ref == 'refs/heads/main' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
    - name: Archive artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: |
          fonts
          out
    outputs:
      zip_name: ${{ env.ZIP_NAME }}
